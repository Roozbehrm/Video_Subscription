# Reverse proxy in front of the Django/daphne app.
# Static files are NOT served here - WhiteNoise (in Django's middleware) serves
# /static/ directly from the app container, so nginx only proxies through.
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200M;  # allow reasonably large video uploads via the admin/API

    # No /media/ location here on purpose: video files live under media/videos/ and must
    # only ever be served through the permission-checked GET /api/videos/{id}/stream/
    # endpoint (which streams from Django, not from disk via nginx). Exposing /media/
    # here would let anyone download videos directly, bypassing subscription checks.

    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # keep long-lived WebSocket connections open
    }

    location / {
        # includes /static/ - WhiteNoise inside Django serves it, with far-future
        # cache headers, straight from this proxied response.
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
